# LifeOS – builds the Android APK and the website on GitHub's servers.
# Runs on every push to "main", or manually from the Actions tab ("Run workflow").
name: Build LifeOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lifeos-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android & Web platform folders
        run: |
          flutter create . --project-name lifeos --platforms=android,web
          # Allow internet access on Android (needed for Supabase)
          grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml || \
            sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

      - name: Get packages
        run: flutter pub get

      - name: Check code (shows readable errors if any)
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Read Supabase keys from repository secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          DEFINES=""
          if [ -n "$SUPABASE_URL" ]; then DEFINES="$DEFINES --dart-define=SUPABASE_URL=$SUPABASE_URL"; fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then DEFINES="$DEFINES --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"; fi
          echo "DEFINES=$DEFINES" >> "$GITHUB_ENV"

      - name: Build website
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/" $DEFINES

      - name: Build Android APK
        run: flutter build apk --release $DEFINES

      - name: Upload APK (download it from this run's page)
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload website for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-website:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
